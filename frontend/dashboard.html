<!DOCTYPE html>
<html>
<head>
    <script>
    // जर टोकन नसेल (म्हणजे लॉगआउट आहे) तर लॉगिनला पाठव
    if (!localStorage.getItem('token')) {
        window.location.href = 'index.html';
    }
</script>
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">


  
</head>
<body>

    <div class="navbar">
        <h2>Student Dashboard</h2>
          <button id="manage-teachers-btn" style="display: none; background-color: #8b5cf6; color: white; margin-right: 10px; padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer;">Manage Teachers</button>
        <button id="logout-btn">Logout</button>
    </div>

    <div class="form-container">
        <h3>Add New Student</h3>
        <form id="student-form">
            <input type="text" id="s-name" placeholder="Name" required>
            <input type="email" id="s-email" placeholder="Email" required>
            <input type="number" id="s-age" placeholder="Age" required>
            <input type="text" id="s-course" placeholder="Course" required>
            <button type="submit">Add Student</button>
        </form>
    </div>

    <div class="list-container">
        <h3>All Students</h3>
        <div id="students-list">
            <!-- हा भाग आपण JavaScript मधून भरू -->
            <p>Loading students...</p>
        </div>
    </div>

    <div id="edit-modal" style="display:none; position:fixed; top:20%; left:30%; background:#fff; padding:20px; border:1px solid #ccc;">
        <h2>Edit Student</h2>
        <form id="edit-form">
        <input type="hidden" id="edit-id">
        <input type="text" placeholder="Name" id="edit-name">
        <input type="email" placeholder="Email" id="edit-email">
        <input type="text" placeholder="Course" id="edit-course">
        <input type="number" placeholder="Age" id="edit-age">
        <button type="submit">Save</button>
        <button type="button" onclick="Cancel_model()">Cancel</button>
        </form>

    </div>

    <script src="dashboard.js"></script>
</body>
</html>
